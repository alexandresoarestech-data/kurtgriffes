<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Kurt Griffes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-body">
    <main class="admin-login">
        <a href="{{ url_for('home') }}" class="admin-voltar">Voltar para a loja</a>
        <h1><span class="brand-mark">♛</span> Kurt Griffes</h1>
        <p>Acesso administrativo</p>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}<div class="flash {{ categoria }}">{{ mensagem }}</div>{% endfor %}
        {% endwith %}
        <form method="post" class="admin-form">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required autofocus>
            <button type="submit" class="btn-comprar">Entrar</button>
        </form>
    </main>
</body>
</html>
